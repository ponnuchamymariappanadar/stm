name: Release to Maven Central

# Runs when you publish a GitHub release, or manually from the Actions tab.
on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 with Maven Central credentials and GPG key
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Maven 3.10 leaves maven-metadata-local.xml in the upload bundle and Maven Central rejects it
      # ("Bundle has content that does NOT have a .pom file"). Build with Maven 3.9 instead.
      - name: Use Maven 3.9.11
        run: mvn -B -N wrapper:wrapper -Dmaven=3.9.11

      - name: Build, sign and upload
        run: |
          ./mvnw -v
          ./mvnw -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
