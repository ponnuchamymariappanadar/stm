# A flow whose checks are decisions from decision/loan-rules.yaml.
# DecisionActor.evaluate(context, input) looks the decision up and returns true/false.
name: loan.flow
startStage: loan
startStep: assess

defaults:
  onError: { nextStage: done, then: error }

stages:
  - name: loan
    steps:
      - step: assess
        then: approve
        check: { class: com.easysoft.decision.DecisionActor, method: evaluate, input: loan.rules/autoApprove }
        onFalse: { nextStage: this, then: triage }
      - step: triage
        then: review
        check: { class: com.easysoft.decision.DecisionActor, method: evaluate, input: loan.rules/needsReview }
        onFalse: { nextStage: done, then: reject }
      - step: approve
        nextStage: done
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: approve }
      - step: review
        nextStage: done
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: review }

  - name: done
    steps:
      - step: reject
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: reject }
      - step: error
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: error }
      - step: finish
        control: stop
