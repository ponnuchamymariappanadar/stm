# The loan flow with one step: the outcome loan.rules/loanOutcome (decision/loan-rules.yaml)
# returns APPROVE, REVIEW or REJECT, and 'cases' route on it. A result with no matching case
# (REJECT here, or null when nothing matched and there is no default) takes the transition's 'fire'.
name: loan.outcome.flow
start: loan.s
fire: loan.check

onError: { to: done.s, fire: loan.error }

states:
  - name: loan.s
    transitions:
      - when: loan.check
        to: done.s
        fire: loan.reject
        actor: { className: com.easysoft.decision.DecisionActor, methodName: decide, argParameter: loan.rules/loanOutcome }
        cases:
          - { when: APPROVE, to: done.s, fire: loan.approve }
          - { when: REVIEW, to: done.s, fire: loan.review }

  - name: done.s
    transitions:
      - when: loan.approve
        fire: loan.finish
        actor: { className: com.easysoft.decision.LoanActions, methodName: approve }
      - when: loan.review
        fire: loan.finish
        actor: { className: com.easysoft.decision.LoanActions, methodName: review }
      - when: loan.reject
        fire: loan.finish
        actor: { className: com.easysoft.decision.LoanActions, methodName: reject }
      - when: loan.error
        fire: loan.finish
        actor: { className: com.easysoft.decision.LoanActions, methodName: error }
      - when: loan.finish
        stmevent: stop
