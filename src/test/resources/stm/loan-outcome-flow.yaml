# The loan flow with one step: the outcome loan.rules/loanOutcome (decision/loan-rules.yaml)
# returns APPROVE, REVIEW or REJECT, and the step's 'outcomes' route on it. A result with no matching
# outcome (REJECT here, or null when nothing matched and there is no default) takes the step's own
# 'then'; an 'otherwise' entry could catch it instead.
name: loan.outcome.flow
startStage: loan
startStep: assess

defaults:
  onError: { nextStage: done, then: error }

stages:
  - name: loan
    steps:
      - step: assess
        nextStage: done
        then: reject
        action: { class: com.easysoft.decision.DecisionActor, method: decide, input: loan.rules/loanOutcome }
        outcomes:
          - { when: APPROVE, nextStage: done, then: approve }
          - { when: REVIEW, nextStage: done, then: review }

  - name: done
    steps:
      - step: approve
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: approve }
      - step: review
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: review }
      - step: reject
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: reject }
      - step: error
        then: finish
        action: { class: com.easysoft.decision.LoanActions, method: error }
      - step: finish
        control: stop
