# The example order flow from the README.
# Keys: startStage, startStep, defaults, stages, steps, step, then, nextStage, runStage, returns,
#       outcomes, otherwise, control, action, check, onFalse, onError, class, method, input.
name: order.flow
startStage: order
startStep: received

defaults:
  onError: { nextStage: failed, then: error }
  onFalse: { nextStage: failed, then: rejected }

stages:
  - name: order
    steps:
      - step: received
        then: validate
        action: { class: com.easysoft.stm.example.OrderActions, method: receive }
      - step: validate
        then: pay
        check: { class: com.easysoft.stm.example.OrderActions, method: isValid }
      # run the payment stage as a sub-flow, then route on the step it finished with
      - step: pay
        runStage: payment
        then: start
        outcomes:
          - { when: approved, nextStage: shipping, then: choose }
        otherwise: { nextStage: failed, then: declined }

  - name: payment
    steps:
      - step: start
        then: approved
        # input passes named texts to the method: charge(order, Map<String, String> input)
        check: { class: com.easysoft.stm.example.OrderActions, method: charge, input: { creditLimit: 1000 } }
        onFalse: { nextStage: this, then: declined }
    returns:
      - step: approved
      - step: declined

  - name: shipping
    steps:
      - step: choose
        then: standard
        action: { class: com.easysoft.stm.example.OrderActions, method: shippingMethod }
        outcomes:
          - { when: EXPRESS, then: express }
      - step: standard
        then: complete
        action: { class: com.easysoft.stm.example.OrderActions, method: shipStandard }
      - step: express
        then: complete
        action: { class: com.easysoft.stm.example.OrderActions, method: shipExpress }
      - step: complete
        control: stop

  - name: failed
    steps:
      - step: error
        then: done
        action: { class: com.easysoft.stm.example.OrderActions, method: recordError }
      - step: rejected
        then: done
        action: { class: com.easysoft.stm.example.OrderActions, method: reject }
      - step: declined
        then: done
        action: { class: com.easysoft.stm.example.OrderActions, method: decline }
      - step: done
        control: stop
